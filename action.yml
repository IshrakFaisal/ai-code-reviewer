name: AI Change Verifier
description: Review a GitHub pull request and publish its evidence summary.
inputs:
  github-token:
    description: GitHub Actions token for reading the PR and updating its comment.
    default: ${{ github.token }}
  nebius-api-key:
    description: Optional Nebius inference key. Set NEBIUS_MODEL in the step environment.
    required: false
  fail-on:
    description: Review-priority threshold (none, medium, or high).
    default: 'none'
  strict:
    description: Fail the job when the review is unavailable.
    default: 'false'
  allow-private:
    description: Allow the job token to read a private pull request.
    default: 'false'
  allow-private-ai:
    description: Allow private pull request data to be sent to the configured inference provider. Requires allow-private.
    default: 'false'
  node-version:
    description: Node.js version for the review.
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/package-lock.json
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --include=dev
    - shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NEBIUS_API_KEY: ${{ inputs.nebius-api-key }}
        REVIEW_FAIL_ON: ${{ inputs.fail-on }}
        REVIEW_STRICT: ${{ inputs.strict }}
        REVIEW_ALLOW_PRIVATE: ${{ inputs.allow-private }}
        REVIEW_ALLOW_PRIVATE_AI: ${{ inputs.allow-private-ai }}
        DEMO_MODE: 'false'
      run: |
        cd "$(mktemp -d)"
        node --input-type=commonjs <<'NODE'
        const path = require("node:path");
        const { createRequire } = require("node:module");
        const entry = path.join(process.env.ACTION_ROOT, "scripts", "pr-action.ts");
        const { createJiti } = createRequire(entry)("jiti");
        const loader = createJiti(entry, { alias: { "@": path.join(process.env.ACTION_ROOT, "src") } });
        loader.import(entry).then(action => action.main()).then(code => { process.exitCode = code; }).catch(() => {
          process.stderr.write("The PR review action could not complete.\n");
          process.exitCode = 1;
        });
        NODE
